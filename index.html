<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cause &amp; Code | Free Custom Websites for Nonprofits</title>
<meta name="description" content="Cause &amp; Code designs and builds custom, accessible websites at no cost for nonprofits and community organizations.">
<meta name="robots" content="index, follow">
<meta name="author" content="Cause & Code">
<meta property="og:type" content="website">
<meta property="og:title" content="Cause &amp; Code | Free Custom Websites for Nonprofits">
<meta property="og:description" content="Cause &amp; Code designs and builds custom, accessible websites at no cost for nonprofits and community organizations.">
<meta property="og:site_name" content="Cause & Code">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cause &amp; Code | Free Custom Websites for Nonprofits">
<meta name="twitter:description" content="Cause &amp; Code designs and builds custom, accessible websites at no cost for nonprofits and community organizations.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B2F62;
    --lime: #CFD260;
    --periwinkle: #A9B8E8;
    --field-fill: #E7EBEE;
    --warm-white: #F8F6F1;
    --muted: #8C95A0;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--warm-white);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--navy);
  }

  a { text-decoration: none; color: inherit; }

  /* --- Nav (overlaid on the hero photo) --- */

  .nav-wrap {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }

  nav {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0;
    padding: 10px 20px;
    position: relative;
    border-radius: 999px;
    background: rgba(238, 241, 243, 0.7);
    backdrop-filter: blur(10px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .logo-mark {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 34px;
    border: 2px solid var(--navy);
    border-radius: 6px;
    padding-top: 5px;
  }

  .logo-dots {
    position: absolute;
    top: 4px;
    left: 6px;
    display: flex;
    gap: 2px;
  }

  .logo-dots span {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--navy);
    display: block;
  }

  .logo-cc { font-size: 15px; }

  .amp { color: var(--lime); }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    margin-left: 0;
    font-family: 'Roboto Mono', monospace;
    font-weight: 500;
    font-size: 15px;
  }

  .nav-links a {
    padding: 10px 18px;
    border-radius: 999px;
    transition: background-color 0.15s ease;
  }

  .nav-links a:hover { background: rgba(11, 47, 98, 0.06); }

  .nav-links a.active {
    background: var(--periwinkle);
    font-weight: 700;
  }

  /* --- Hero --- */

  .hero {
    position: relative;
    min-height: 100vh;
    background-image: url('images/hero-photo.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 620px;
    padding: 140px 6vw 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .hero-content h1 {
    font-size: clamp(36px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.15;
    margin: 0;
  }

  .hero-content p {
    font-size: clamp(17px, 2vw, 21px);
    font-weight: 500;
    line-height: 1.5;
    margin: 0;
    max-width: 480px;
  }

  .hero-cta {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    justify-content: center;
    padding: 20px 32px;
    border-radius: var(--radius);
    background: rgba(248, 246, 241, 0.7);
    backdrop-filter: blur(10px);
    color: var(--navy);
    font-weight: 700;
    font-size: 20px;
    cursor: pointer;
  }

  .hero-cta:hover {
    background: rgba(248, 246, 241, 0.9);
  }

  @media (max-width: 700px) {
    .hero-content { padding: 120px 24px 60px; }
  }

  @media (max-width: 760px) {
    nav { padding: 10px 14px; }
    .nav-links {
      position: static;
      transform: none;
      margin-left: auto;
      gap: 2px;
      font-size: 12px;
    }
    .nav-links a { padding: 8px 9px; }
    .logo { font-size: 12px; gap: 6px; }
    .logo-mark { width: 38px; height: 30px; }
  }

</style>
</head>
<body>

<div class="hero">
  <div class="nav-wrap">
    <nav>
      <a class="logo" href="index.html">
        <span class="logo-mark">
          <span class="logo-dots"><span></span><span></span><span></span></span>
          <span class="logo-cc">C<span class="amp">&amp;</span>C</span>
        </span>
        <span class="logo-word">CAUSE <span class="amp">&amp;</span> CODE</span>
      </a>
      <div class="nav-links">
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="get-started.html">Get Started</a>
      </div>
    </nav>
  </div>

  <div class="hero-content">
    <h1>Building websites for those building change</h1>
    <p>Custom, accessible websites for nonprofits and community organizations, built at no cost.</p>
    <a class="hero-cta" href="get-started.html">Get Started</a>
  </div>
</div>

</body>
</html>
